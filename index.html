<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Hub</title>
<meta name="theme-color" content="#fff4e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2f3a; --cream:#fff4e6; --bg:#fffaf3; --line:#ecdcc6; --muted:#8a8f9a;
  --org:#ff8a3d; --org-d:#e8681a; --red:#ff6b6b; --yel:#ffd43b; --blu:#4dabf7; --grn:#40c057; --pur:#9775fa;
  --hf:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --bf:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:15px;min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none;padding:0;font-size:inherit}
input,textarea,select{font-family:var(--bf);font-size:16px;color:var(--ink)}
a{color:#1c7ed6}
.hide{display:none!important}
.muted{color:var(--muted)}
small{font-size:12px}

/* ---------- layout ---------- */
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
.top{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:3px solid var(--ink);padding:10px 14px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;flex:1;font-family:var(--hf);font-weight:400;font-size:24px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.top h1 .f{color:var(--org)}
.top .back{width:38px;height:38px;border-radius:12px;background:#fff;border:2.5px solid var(--ink);font-size:20px;display:grid;place-items:center}
.tbtn{position:relative;width:40px;height:40px;border-radius:13px;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 var(--ink)}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bdg{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.wrap{padding:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid var(--ink);padding:6px 6px calc(6px + var(--safe-b))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--muted);font-size:12px;padding:4px 0;border-radius:12px;position:relative}
.nav a i{font-style:normal;font-size:23px;line-height:1.1;filter:grayscale(.85);opacity:.8}
.nav a.on{color:var(--ink);background:var(--cream)}
.nav a.on i{filter:none;opacity:1}
.nav .bdg{top:-2px;right:calc(50% - 26px)}

/* ---------- cards & ui ---------- */
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 5px 0 var(--line)}
.card h3{margin:0 0 10px;font-family:var(--hf);font-weight:400;font-size:18px;display:flex;align-items:center;gap:6px}
.card h3 small{font-family:var(--bf);color:var(--muted);font-size:12.5px;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:9px 14px;font-size:15px;box-shadow:0 3px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.p{background:var(--org);color:#fff}
.btn.y{background:var(--yel)}
.btn.g{background:var(--grn);color:#fff}
.btn.r{background:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:11px;box-shadow:0 2px 0 var(--ink)}
.btn.block{width:100%}
a.btn,a.chip{text-decoration:none;color:inherit}
a.btn.p{color:#fff}
.btn[disabled]{opacity:.45}
.inp{width:100%;border:2.5px solid var(--ink);border-radius:13px;padding:10px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--org)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center}
.row>.inp{flex:1;min-width:0}
.lbl{display:block;margin:12px 0 5px;font-size:13.5px;color:#555}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);border-radius:999px;padding:5px 11px;background:#fff;font-size:13.5px}
.chip.on{background:var(--ink);color:#fff}
.empty{text-align:center;color:var(--muted);padding:22px 8px;line-height:1.6}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c,#eee);border:2.5px solid var(--ink);flex:0 0 auto;line-height:1}
.bar{height:10px;border-radius:6px;background:#f1e6d6;overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--grn);border-radius:4px;transition:width .3s}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:8px 0 0}
.sep{height:1px;background:var(--line);margin:12px 0}

/* ---------- toast & modal ---------- */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;z-index:200;transition:.25s;max-width:88vw;text-align:center;font-size:14px;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#e03131}
.mask{position:fixed;inset:0;background:rgba(30,30,40,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;border:3px solid var(--ink);border-bottom:none;padding:16px 16px calc(18px + var(--safe-b));animation:up .2s}
.sheet h2{margin:0 0 12px;font-family:var(--hf);font-weight:400;font-size:21px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;font-size:22px;width:36px;height:36px;border-radius:12px;background:#f3f0ea}
.sheet .foot{display:flex;gap:8px;margin-top:16px}
.sheet .foot .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}
.lightbox .lb-bar{display:flex;gap:10px;margin-top:14px}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;background:var(--cream)}
.logo-big{font-family:var(--hf);font-size:44px;letter-spacing:-1px;margin:0;line-height:1}
.logo-big .f{color:var(--org)}
.login .sub{margin:8px 0 26px;color:#7b6a55}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:360px}
.who button{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--ink);font-size:18px}
.who button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.who .av{width:62px;height:62px;font-size:34px}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:14px 0 18px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.pin-dots i.on{background:var(--org)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pad button{height:62px;border-radius:18px;background:#fff;border:3px solid var(--ink);font-size:26px;font-family:var(--hf);box-shadow:0 4px 0 var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad button.fn{font-size:16px;font-family:var(--bf);background:#f8f1e6}

/* ---------- home ---------- */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alert{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.alert .ai{font-size:24px}
.alert b{display:block;font-weight:400;font-size:15px}
.alert small{color:var(--muted)}
.alert.hot{background:#fff0f0}
.alert.gold{background:#fff9db}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mcard{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 10px 10px;text-align:center;box-shadow:0 5px 0 var(--c,#ddd);position:relative;width:100%}
.mcard .av{width:56px;height:56px;font-size:31px}
.mcard .nm{font-size:18px;margin-top:5px}
.mcard .days{font-family:var(--hf);font-size:21px;color:var(--org-d);margin:2px 0 0;letter-spacing:-.3px}
.mcard .days small{font-family:var(--bf);font-size:12px;color:var(--muted)}
.mcard .meta{font-size:12px;color:var(--muted);margin-top:3px;min-height:16px}
.mcard .bar{margin-top:7px;height:8px}
.mcard .mood{position:absolute;top:8px;right:9px;font-size:20px}
.mcard .pt{position:absolute;top:9px;left:9px;font-size:11.5px;background:var(--yel);border:2px solid var(--ink);border-radius:999px;padding:1px 6px}
.mcard .st{font-size:12px;margin-top:4px;color:#1971c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moodpick{display:flex;justify-content:space-between;gap:4px}
.moodpick button{flex:1;font-size:27px;padding:6px 0;border-radius:14px;border:2.5px solid transparent}
.moodpick button.on{border-color:var(--ink);background:var(--cream)}
.moodpick button small{display:block;font-size:11px;color:var(--muted)}
.score-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.score-row input[type=range]{flex:1;accent-color:var(--org);height:30px}
.score-big{font-family:var(--hf);font-size:30px;color:var(--org-d);min-width:64px;text-align:right}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick a,.quick button{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink);font-size:12.5px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 2px;position:relative}
.quick i{font-style:normal;font-size:26px}
.otd{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.otd .ph{flex:0 0 96px;height:96px;border-radius:14px;border:2.5px solid var(--ink);background:#eee center/cover;position:relative}
.otd .ph span{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 6px;border-radius:8px}

/* ---------- todo ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 44px;border:2px solid var(--line);border-radius:12px;padding:5px 0;background:#fff;font-size:15px;line-height:1.15}
.strip button small{display:block;font-size:10.5px;color:var(--muted)}
.strip button.part{border-color:var(--yel);background:#fff9db}
.strip button.ok{border-color:var(--grn);background:#ebfbee}
.strip button.today{box-shadow:inset 0 -3px 0 var(--org)}
.strip button.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.strip button.sel small{color:#ddd}
.tlist{list-style:none;margin:8px 0 0;padding:0}
.tlist li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1.5px dashed var(--line)}
.tlist li:last-child{border-bottom:none}
.ck{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:18px;color:#fff;flex:0 0 auto;background:#fff}
.tlist li.done .ck{background:var(--grn)}
.tlist li .tt{flex:1;font-size:16px;word-break:break-all}
.tlist li.done .tt{text-decoration:line-through;color:var(--muted)}
.tlist li .del{color:#c9c2b8;font-size:18px;padding:4px}
.who-chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.who-chips button{display:flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:999px;padding:4px 10px 4px 4px;background:#fff;font-size:14px;flex:0 0 auto}
.who-chips button.on{background:var(--ink);color:#fff}
.who-chips .av{width:26px;height:26px;font-size:15px;border-width:1.5px}
.pts{display:flex;justify-content:space-around;text-align:center}
.pts b{display:block;font-family:var(--hf);font-weight:400;font-size:26px;color:var(--org-d)}
.pts span{font-size:12px;color:var(--muted)}
.celebrate{text-align:center;padding:10px 0}
.celebrate .e{font-size:72px;animation:pop .6s}
.celebrate h2{justify-content:center;font-size:26px!important;color:var(--org-d)}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- family / map ---------- */
#map{height:300px;border-radius:16px;border:3px solid var(--ink);overflow:hidden;background:#e9ecef;z-index:1}
.loc-list{list-style:none;margin:0;padding:0}
.loc-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.loc-list li:last-child{border:none}
.loc-list .av{width:38px;height:38px;font-size:21px}
.loc-list .info{flex:1;min-width:0}
.loc-list .info small{display:block;color:var(--muted)}
.arrive{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.arrive button{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:10px 2px;font-size:13.5px;box-shadow:0 3px 0 var(--ink)}
.arrive button i{display:block;font-style:normal;font-size:24px}
.arrive button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pin-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:3px solid #2b2f3a;font-size:22px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:20px;background:#ccc;border:2.5px solid var(--ink);transition:.2s}
.switch span::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);top:2px;left:2px;transition:.2s}
.switch input:checked+span{background:var(--grn)}
.switch input:checked+span::after{left:24px}

/* ---------- messages ---------- */
.msg{display:flex;gap:10px;padding:11px 0;border-bottom:1.5px dashed var(--line)}
.msg:last-child{border:none}
.msg .av{width:40px;height:40px;font-size:22px}
.msg .mb{flex:1;min-width:0}
.msg .mh{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.msg .mh b{color:var(--ink);font-weight:400;font-size:15px}
.msg .mt{margin-top:4px;background:var(--cream);border-radius:4px 16px 16px 16px;padding:9px 12px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.msg.out .mt{background:#e7f5ff}
.sealed{margin-top:5px;background:linear-gradient(135deg,#ffe3e3,#fff0f6);border:2.5px dashed #e64980;border-radius:14px;padding:12px;text-align:center;width:100%;font-size:15px}
.cap{border:3px solid var(--ink);border-radius:18px;padding:12px;margin-bottom:10px;background:#fff}
.cap.locked{background:repeating-linear-gradient(45deg,#f8f0ff,#f8f0ff 10px,#fff 10px,#fff 20px)}
.cap .ch{display:flex;align-items:center;gap:8px}
.cap .dd{margin-left:auto;font-family:var(--hf);color:var(--pur);font-size:18px}
.cap .cb{margin-top:8px;white-space:pre-wrap;line-height:1.6;background:#fffbea;border-radius:12px;padding:10px}

/* ---------- board ---------- */
.post{background:#fff;border:3px solid var(--ink);border-radius:20px;margin-bottom:14px;overflow:hidden;box-shadow:0 5px 0 var(--line)}
.post .ph{display:flex;align-items:center;gap:9px;padding:11px 12px}
.post .ph .av{width:38px;height:38px;font-size:21px}
.post .ph small{display:block;color:var(--muted)}
.post .ph .more{margin-left:auto;font-size:20px;color:var(--muted);padding:4px 6px}
.post .pb{padding:0 13px 10px;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:15.5px}
.pics{display:grid;gap:2px;background:#eee}
.pics.n1{grid-template-columns:1fr}
.pics.n2,.pics.n4{grid-template-columns:1fr 1fr}
.pics.n3,.pics.n5,.pics.n6{grid-template-columns:1fr 1fr 1fr}
.pics .pic{aspect-ratio:1;background:#e9e4dc center/cover no-repeat}
.pics.n1 .pic{aspect-ratio:auto;min-height:200px;max-height:480px}
.pics.n1 .pic img{width:100%;display:block}
.post .pa{display:flex;gap:14px;padding:9px 13px;border-top:1.5px dashed var(--line);font-size:14px;align-items:center}
.post .pa .liked{color:#e03131}
.post .cm{padding:2px 13px 10px;font-size:14px}
.post .cm div{padding:4px 0;display:flex;gap:6px;align-items:flex-start}
.post .cm div b{font-weight:400;color:var(--org-d);flex:0 0 auto}
.post .cm div span{flex:1;word-break:break-word}
.post .cm div button{color:#c9c2b8}
.upl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.upl .th{width:72px;height:72px;border-radius:12px;border:2px solid var(--ink);background:#eee center/cover;position:relative}
.upl .th button{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.upl .add{width:72px;height:72px;border-radius:12px;border:2.5px dashed var(--ink);font-size:24px;display:grid;place-items:center;background:#fff}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.album .pic{aspect-ratio:1;background:#e9e4dc center/cover;border-radius:6px}

/* ---------- more ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--tc,var(--line));position:relative;font-size:14px}
.tile i{font-style:normal;font-size:32px}
.tile small{font-size:11px;color:var(--muted)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tc,var(--line))}

/* ---------- calendar ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-family:var(--hf);font-weight:400;font-size:21px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);padding:2px 0}
.cal .wd:first-child{color:#e03131}.cal .wd:last-child{color:#1c7ed6}
.cal button{aspect-ratio:1;border-radius:11px;font-size:14.5px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;border:2px solid transparent}
.cal button.out{color:#ccc}
.cal button.td{background:var(--cream);border-color:var(--org)}
.cal button.sel{border-color:var(--ink);background:#fff3bf}
.cal button.sun{color:#e03131}.cal button.sat{color:#1c7ed6}
.cal button .dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cal button .dots i{width:6px;height:6px;border-radius:50%;background:var(--org)}
.ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.ev:last-child{border:none}
.ev .ei{font-size:22px;width:34px;text-align:center}
.ev .eb{flex:1;min-width:0}
.ev .eb small{display:block;color:var(--muted)}
.ev .dd{font-family:var(--hf);font-size:16px;color:var(--org-d);white-space:nowrap}

/* ---------- shop / mission / growth / report ---------- */

async function phGet(id) { const db = await phDB(); if (!db) return null; return new Promise(res => { try { const q = db.transaction('p').objectStore('p').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); }
async function phPut(id, v) { const db = await phDB(); if (!db) return; try { db.transaction('p', 'readwrite').objectStore('p').put(v, id); } catch (e) {} }
async function photoSrc(id) {
  if (PH.mem.has(id)) return PH.mem.get(id);
  const p = (async () => { let v = await phGet(id); if (!v) { try { const r = await rpc('fh_photo', { p_id: id }); v = r && r.data; if (v) phPut(id, v); } catch (e) {} } return v; })();
  PH.mem.set(id, p); return p;
}
function compressImage(file, max = 1280, q = .8) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { let { width: w, height: h } = img; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res({ data: c.toDataURL('image/jpeg', q), w, h }); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없어요')); }; img.src = url; });
}

function bindPosts(root, reload) {
  $$('.pic[data-pid]', root).forEach(async d => { const id = +d.dataset.pid, src = await photoSrc(id); if (!src) return; d.style.backgroundImage = `url(${src})`; d.onclick = () => lightbox(src, `familyhub_${id}.jpg`); d.removeAttribute('data-pid'); });
  $$('[data-like]', root).forEach(b => b.onclick = async () => { try { await rpc('fh_like', { p_post: +b.dataset.like }); reload(); } catch (e) { toast(e.message, 1); } });
  $$('[data-pdel]', root).forEach(b => b.onclick = async () => { if (!(await confirmBox('이 글을 지울까요? (사진·댓글도 같이 지워져요)', '지우기'))) return; await rpc('fh_post_del', { p_id: +b.dataset.pdel }); reload(); });
  $$('[data-cdel]', root).forEach(b => b.onclick = async () => { await rpc('fh_comment_del', { p_id: +b.dataset.cdel }); reload(); });
  const send = async id => { const i = $(`[data-cin="${id}"]`, root); const v = i.value.trim(); if (!v) return; try { await rpc('fh_comment_add', { p_post: id, p_body: v }); reload(); } catch (e) { toast(e.message, 1); } };
  $$('[data-csend]', root).forEach(b => b.onclick = () => send(+b.dataset.csend));
  $$('[data-cin]', root).forEach(i => i.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(+i.dataset.cin); } });
}

function postCompose(done) {
  const files = [];
  sheet(`<h2>📝 글쓰기<button class="x" data-close>✕</button></h2>
    <textarea class="inp" id="pBody" maxlength="3000" placeholder="무슨 일이 있었나요?" style="min-height:120px"></textarea>
    <div class="upl" id="pUp"></div><input type="file" id="pFile" accept="image/*" multiple hidden>
    <p class="hint">사진은 최대 10장 · 자동으로 줄여서 올려요</p>
    <div class="foot"><button class="btn" data-close>취소</button><button class="btn p" id="pSave">올리기</button></div>`, (s, close) => {
    const up = s.querySelector('#pUp'), fi = s.querySelector('#pFile');
    const paint = () => { up.innerHTML = files.map((f, i) => `<div class="th" style="background-image:url(${f.data})"><button data-rm="${i}">✕</button></div>`).join('') + (files.length < 10 ? '<button class="add" id="pAdd">📷</button>' : '');
      up.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { files.splice(+b.dataset.rm, 1); paint(); }); const a = up.querySelector('#pAdd'); if (a) a.onclick = () => fi.click(); };
    fi.onchange = async () => { for (const f of [...fi.files].slice(0, 10 - files.length)) { try { files.push(await compressImage(f)); } catch (e) { toast(e.message, 1); } } fi.value = ''; paint(); };
    paint();
    s.querySelector('#pSave').onclick = async () => {
      const body = s.querySelector('#pBody').value.trim(); if (!body && !files.length) return toast('글이나 사진을 넣어 주세요', 1);
      const btn = s.querySelector('#pSave'); btn.disabled = true;
      try { const { id } = await rpc('fh_post_add', { p_body: body });
        for (let i = 0; i < files.length; i++) { btn.textContent = `사진 올리는 중 ${i + 1}/${files.length}`; await rpc('fh_photo_add', { p_post: id, p_data: files[i].data, p_w: files[i].w, p_h: files[i].h, p_sort: i }); }
        await rpc('fh_post_done', { p_post: id }); close(); toast('올렸어요 🎉'); done && done(); }
      catch (e) { toast(e.message, 1); btn.disabled = false; btn.textContent = '올리기'; }
    };
  });
}

route('/cal', '📅 가족 캘린더', async (el, alive) => {
  const h = await loadHome(); if (!alive()) return;
  const q = new URLSearchParams(location.hash.split('?')[1] || ''), td = dayKey();
  const ym = q.get('ym') || td.slice(0, 7), sel = q.get('d') || (ym === td.slice(0, 7) ? td : ym + '-01');
  const [Y, Mo] = ym.split('-').map(Number), first = new Date(Y, Mo - 1, 1), start = addDays(dayKey(first), -first.getDay());
  const items = k => {   // 그날의 일정·생일·기념일
    const out = [];
    h.events.forEach(e => { const hit = e.yearly ? e.day.slice(5) === k.slice(5) && k >= e.day : e.day === k; if (hit) out.push({ i: CAT[e.category] || '📌', t: e.title + (e.yearly && k > e.day ? ` (${D(k).getFullYear() - D(e.day).getFullYear()}주년)` : ''), s: `${e.category}${e.memo ? ' · ' + e.memo : ''} · ${e.by || ''}`, e }); });
    (h.trips || []).forEach(t => { if (k >= t.start_on && k <= t.end_on) out.push({ i: t.emoji, t: `${t.title} (Day ${diffDays(k, t.start_on) + 1})`, s: '가족 여행', trip: t.id }); });
    S.members.forEach(m => { if (m.birth.slice(5) === k.slice(5) && k >= m.birth) out.push({ i: '🎂', t: `${m.nick} ${D(k).getFullYear() - D(m.birth).getFullYear()}번째 생일`, s: '자동 표시' });
      const n = diffDays(k, m.birth) + 1; if (n > 0 && n % 1000 === 0) out.push({ i: '✨', t: `${m.nick} ${fmtN(n)}일`, s: '살아온 날 기념' }); });
    return out;
  };
  const prevYm = dayKey(new Date(Y, Mo - 2, 1)).slice(0, 7), nextYm = dayKey(new Date(Y, Mo, 1)).slice(0, 7);
  const cells = [...Array(42)].map((_, i) => { const k = addDays(start, i), it = items(k), w = D(k).getDay();
    return `<button data-day="${k}" class="${k.slice(0, 7) !== ym ? 'out' : ''} ${k === td ? 'td' : ''} ${k === sel ? 'sel' : ''} ${w === 0 ? 'sun' : w === 6 ? 'sat' : ''}">${D(k).getDate()}<span class="dots">${it.slice(0, 3).map(x => `<i style="background:${x.i === '🎂' ? '#f06595' : x.i === '✨' ? '#fab005' : 'var(--org)'}"></i>`).join('')}</span></button>`; }).join('');
  // 다가오는 60일

  el.innerHTML = `<div class="card"><div class="cal-h"><a class="btn sm" href="#/cal?ym=${prevYm}">‹</a><b>${Y}년 ${Mo}월</b><a class="btn sm" href="#/cal?ym=${nextYm}">›</a></div>
      <div class="cal">${WD.split('').map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div></div>
    <div class="card"><h3>${md(sel)} <small><button class="btn p sm" id="evAdd">＋ 일정 추가</button></small></h3>${items(sel).map(x => evRow(x, sel)).join('') || '<div class="empty" style="padding:10px">일정이 없어요</div>'}</div>
    <div class="card"><h3>🔜 다가오는 일정 <small>60일</small></h3>${up.length ? up.map(x => evRow(x, x.k, true)).join('') : '<div class="empty" style="padding:10px">다가오는 일정이 없어요</div>'}</div>`;
  $$('[data-day]', el).forEach(b => b.onclick = () => go(`#/cal?ym=${b.dataset.day.slice(0, 7)}&d=${b.dataset.day}`));
  $('#evAdd').onclick = () => eventForm(null, sel);

    <label class="lbl">메모</label><input class="inp" id="eM" maxlength="300" value="${esc(x.memo || '')}" placeholder="장소, 준비물 등">

function lineChart(pts, color, unit) {
  const W = 340, H = 140, P = 26, xs = pts.map(p => D(p[0]).getTime()), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1, y0 = Math.min(...ys), y1 = Math.max(...ys), yp = (y1 - y0) * .15 || 1;
  const X = t => P + (t - x0) / ((x1 - x0) || 1) * (W - P * 2), Y = v => H - P + 8 - (v - (y0 - yp)) / ((y1 + yp) - (y0 - yp)) * (H - P * 1.6);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  return `<svg class="gchart" viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${H - P + 8}" x2="${W - P}" y2="${H - P + 8}" stroke="#ecdcc6" stroke-width="1.5"/><path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"/>${i === 0 || i === pts.length - 1 ? `<text x="${X(xs[i]).toFixed(1)}" y="${(Y(p[1]) - 9).toFixed(1)}" text-anchor="${i === 0 ? 'start' : 'end'}" font-size="12" fill="#2b2f3a">${p[1]}${unit}</text><text x="${X(xs[i]).toFixed(1)}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : 'end'}" font-size="10.5" fill="#8a8f9a">${p[0].slice(2).replace(/-/g, '.')}</text>` : ''}`).join('')}</svg>`;
}

    ${best && best.points > 0 ? `<div class="card" style="background:#fff9db;text-align:center"><div style="font-size:40px">👑</div><b style="font-weight:400;font-size:18px">이번 주 MVP · ${esc(M(best.id).nick)}</b><div class="muted" style="font-size:13px">${fmtN(best.points)}점을 모았어요!</div></div>` : ''}
    ${r.members.map(x => { const m = M(x.id); return `<div class="rep">${best && best.id === x.id && x.points > 0 ? '<span class="crown">👑</span>' : ''}<div class="rh">${av(m, 44)}<b>${esc(m.nick)}</b><span style="margin-left:auto" class="muted">${x.score != null ? `평균 ${x.score}점` : '점수 기록 없음'}</span></div>
      <div class="stats"><div><b>${x.todo_d}/${x.todo_n}</b><span>할 일</span></div><div><b>${x.perfect}</b><span>완벽한 날</span></div><div><b>${fmtN(x.points)}</b><span>포인트</span></div><div><b>${x.stickers}</b><span>칭찬</span></div></div>
      <div class="moods">${[...Array(7)].map((_, i) => { const k = addDays(start, i), mo = x.moods.find(y => y.day === k); return `<span title="${md(k)}">${mo ? mo.mood : '<span style="opacity:.2">⚪</span>'}</span>`; }).join('')}</div></div>`; }).join('')}
    ${r.photos.length ? `<div class="card"><h3>📸 이번 주 사진</h3><div class="album">${r.photos.map(id => `<div class="pic" data-pid="${id}"></div>`).join('')}</div></div>` : ''}
    <div class="card"><h3>🧾 그 밖에</h3><div class="ev"><span class="ei">🛒</span><span class="eb">장보기로 산 물건</span><span class="dd">${r.shopping}개</span></div><div class="ev"><span class="ei">📍</span><span class="eb">도착 알림</span><span class="dd">${r.checkins}번</span></div><div class="ev"><span class="ei">📝</span><span class="eb">게시판 글</span><span class="dd">${r.members.reduce((a, x) => a + x.posts, 0)}개</span></div></div>`;
  $$('.pic[data-pid]', el).forEach(async d => { const src = await photoSrc(+d.dataset.pid); if (src) { d.style.backgroundImage = `url(${src})`; d.onclick = () => lightbox(src); } });
});

const TRIP_EMO = ['✈️', '🏝', '🏔', '🚗', '🏕', '🎢', '🚢', '🚄', '🇯🇵', '🇺🇸', '🇻🇳', '🇹🇭', '🇪🇺', '🇨🇳'];
const PACK_TPL = {
  '🧳 기본': ['휴대폰 충전기', '보조배터리', '세면도구', '상비약', '속옷', '양말', '잠옷', '선크림', '우산'],

  '👶 아이': ['아이 상비약(해열제)', '물티슈', '아이 간식', '장난감·책', '여벌 옷', '아이 물병', '체온계'],
  '🏊 물놀이': ['수영복', '래쉬가드', '수경', '튜브', '방수팩', '비치타월', '아쿠아슈즈'],
  '⛄ 겨울': ['패딩', '장갑', '목도리', '핫팩', '털모자', '립밤'],
  '🏕 캠핑': ['텐트', '침낭', '랜턴', '버너·가스', '코펠', '아이스박스', '모기퇴치제']
};
const DOC_KIND = { passport: ['🛂', '여권'], photo: ['🪪', '여권·증명사진'], ticket: ['✈️', '항공권·승차권'], stay: ['🏨', '숙소 예약'], insurance: ['🛡', '여행자보험'], etc: ['📎', '기타'] };
const EXP_CAT = { '교통': '🚌', '숙박': '🏨', '식비': '🍜', '관광': '🎡', '쇼핑': '🛍', '기타': '💳' };
const isAbroad = t => t.country && !/^(대한민국|한국|국내|korea)$/i.test(t.country.trim());
const mapLink = (t, place) => isAbroad(t) ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}` : `https://map.naver.com/p/search/${encodeURIComponent(place)}`;
const tripDays = t => { const out = []; for (let k = t.start_on; k <= t.end_on; k = addDays(k, 1)) out.push(k); return out; };
function tripDD(t) { const td = dayKey(); if (td < t.start_on) return { txt: 'D-' + diffDays(t.start_on, td), cls: 'up' }; if (td <= t.end_on) return { txt: `여행 ${diffDays(td, t.start_on) + 1}일째`, cls: 'now' }; return { txt: '다녀옴', cls: 'past' }; }
const nights = t => { const n = diffDays(t.end_on, t.start_on); return n ? `${n}박 ${n + 1}일` : '당일'; };
const TFILE = new Map();
async function tripFileSrc(id) { if (!TFILE.has(id)) TFILE.set(id, rpc('fh_trip_file', { p_id: id }).then(r => r.data).catch(() => null)); return TFILE.get(id); }

route('/trip', '✈️ 가족 여행', async (el, alive) => {
  const q = new URLSearchParams(location.hash.split('?')[1] || ''), id = +q.get('id');
  if (id) return tripDetail(el, alive, id, q.get('tab') || 'plan');
  const l = await rpc('fh_trips'); if (!alive()) return; const td = dayKey();
  const now = l.filter(t => t.end_on >= td), past = l.filter(t => t.end_on < td);
  const card = t => { const d = tripDD(t), pc = t.pack_n ? Math.round(t.pack_d / t.pack_n * 100) : 0;
    return `<button class="trip-card ${t.mine ? '' : 'other'} ${d.cls}" data-trip="${t.id}" data-mine="${t.mine ? 1 : 0}"><span class="te">${t.emoji}</span><span class="tb"><b>${esc(t.title)}</b><small>${esc(t.place || '')}${t.place ? ' · ' : ''}${md(t.start_on)} ~ ${md(t.end_on)} · ${nights(t)}</small>
      <span class="tm">${t.members.map(i => M(i).emoji).join('')}${t.mine ? '' : ' <span class="tag">참여 안 함</span>'}</span>${t.mine && t.end_on >= td && t.pack_n ? `<span class="bar" style="margin-top:6px;height:8px"><i style="width:${pc}%"></i></span><small>준비물 ${t.pack_d}/${t.pack_n}</small>` : ''}</span><span class="tdd">${d.txt}</span></button>`; };
  el.innerHTML = `<button class="btn p block" id="trNew" style="margin-bottom:14px">＋ 새 가족 여행 만들기</button>
    ${now.length ? `<div class="card"><h3>🧳 다가오는 여행</h3>${now.map(card).join('')}</div>` : '<div class="card empty">아직 계획한 여행이 없어요<br><small>장소·날짜·함께 갈 가족을 정하면 일정·준비물·서류·경비를 한곳에서 챙길 수 있어요</small></div>'}
    ${past.length ? `<div class="card"><h3>📷 다녀온 여행 <small>${past.length}번</small></h3>${past.map(card).join('')}</div>` : ''}`;
  $('#trNew').onclick = () => tripForm(null);
  $$('[data-trip]', el).forEach(b => b.onclick = () => b.dataset.mine === '1' ? go('#/trip?id=' + b.dataset.trip) : toast('함께 가는 가족만 자세히 볼 수 있어요'));
});

async function tripDetail(el, alive, id, tab) {
  const r = await rpc('fh_trip', { p_id: id }); if (!alive()) return;
  const t = r.trip, d = tripDD(t), plans = r.items.filter(i => i.kind === 'plan'), packs = r.items.filter(i => i.kind === 'pack');
  const canDel = t.created_by === S.me.id || S.me.role === 'admin';
  const TABS = [['plan', '🗓 일정'], ['pack', `🧳 준비물${packs.length ? ` ${packs.filter(p => p.done).length}/${packs.length}` : ''}`], ['doc', '🛂 서류'], ['money', '💰 경비'], ['share', '💬 공유'], ['info', 'ℹ️ 정보']];
  el.innerHTML = `<div class="card trip-head"><div class="row"><span style="font-size:44px">${t.emoji}</span><div style="flex:1;min-width:0"><b style="font-weight:400;font-size:20px">${esc(t.title)}</b>
      <div class="muted" style="font-size:13px">${esc(t.place || '')}${t.country ? ` (${esc(t.country)})` : ''}</div><div style="font-size:13.5px">${md(t.start_on)} ~ ${md(t.end_on)} · ${nights(t)}</div></div><span class="tdd big">${d.txt}</span></div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">${t.members.map(i => `<span class="tag" style="font-size:13px">${M(i).emoji} ${esc(M(i).nick)}</span>`).join('')}<button class="btn sm" id="trEdit" style="margin-left:auto">✏️ 수정</button></div></div>
    <div class="ttabs">${TABS.map(([k, n]) => `<a class="chip ${tab === k ? 'on' : ''}" href="#/trip?id=${id}&tab=${k}">${n}</a>`).join('')}</div>
    <div id="tbody"></div>`;
  $('#trEdit').onclick = () => tripForm(t);
  const body = $('#tbody'), reload = () => tripDetail(el, alive, id, tab);
  const fn = { plan: tripPlan, pack: tripPack, doc: tripDoc, money: tripMoney, share: tripShare, info: tripInfo }[tab] || tripPlan;
  fn(body, r, t, reload, canDel);
}

function tripPlan(el, r, t, reload) {
  const plans = r.items.filter(i => i.kind === 'plan'), td = dayKey(), days = tripDays(t), none = plans.filter(p => !p.day || !days.includes(p.day));
  const row = p => `<div class="plan" data-pl="${p.id}"><span class="pt">${p.time || '--:--'}</span><span class="pb"><b>${esc(p.title)}</b>${p.place ? `<a href="${mapLink(t, p.place)}" target="_blank" rel="noopener" class="pmap" onclick="event.stopPropagation()">🗺 ${esc(p.place)}</a>` : ''}${p.memo ? `<small>${linkify(p.memo)}</small>` : ''}</span></div>`;
  el.innerHTML = days.map((k, i) => { const l = plans.filter(p => p.day === k); return `<div class="card day ${k === td ? 'today' : ''}"><h3>Day ${i + 1} <small style="margin-left:6px">${md(k)}${k === td ? ' · 오늘' : ''}</small><small><button class="btn sm" data-addday="${k}">＋ 추가</button></small></h3>${l.map(row).join('') || '<div class="muted" style="font-size:13.5px;padding:4px 0">아직 일정이 없어요</div>'}</div>`; }).join('')
    + (none.length ? `<div class="card"><h3>📌 날짜 미정</h3>${none.map(row).join('')}</div>` : '')
    + `<p class="hint">장소를 넣으면 ${isAbroad(t) ? '구글 지도' : '네이버 지도'}로 바로 열 수 있어요. 일정을 누르면 고칠 수 있어요.</p>`;
  $$('[data-addday]', el).forEach(b => b.onclick = () => planForm(t, null, b.dataset.addday, reload));
  $$('[data-pl]', el).forEach(b => b.onclick = () => planForm(t, plans.find(p => p.id === +b.dataset.pl), null, reload));
}
function planForm(t, p, day, reload) {
  const x = p || { day, time: '', title: '', place: '', memo: '' }, days = tripDays(t);
  sheet(`<h2>${p ? '✏️ 일정 고치기' : '🗓 일정 추가'}<button class="x" data-close>✕</button></h2>
    <label class="lbl">날짜</label><div class="chips">${days.map((k, i) => `<button class="chip ${x.day === k ? 'on' : ''}" data-d="${k}">Day${i + 1} ${D(k).getMonth() + 1}/${D(k).getDate()}</button>`).join('')}</div>
    <div class="row" style="margin-top:4px"><div style="flex:0 0 120px"><label class="lbl">시간</label><input class="inp" type="time" id="plT" value="${x.time || ''}"></div><div style="flex:1"><label class="lbl">할 일</label><input class="inp" id="plN" maxlength="80" value="${esc(x.title)}" placeholder="예: 유니버설 스튜디오"></div></div>
    <label class="lbl">장소 (지도 검색어)</label><input class="inp" id="plP" maxlength="120" value="${esc(x.place || '')}" placeholder="예: 유니버설 스튜디오 재팬">
    <label class="lbl">메모</label><textarea class="inp" id="plM" maxlength="500" placeholder="예약번호, 입장 시간, 링크 등" style="min-height:64px">${esc(x.memo || '')}</textarea>
    <div class="foot">${p ? '<button class="btn r" id="plD">지우기</button>' : '<button class="btn" data-close>취소</button>'}<button class="btn p" id="plS">저장</button></div>`, (s, close) => {
    let dd = x.day; s.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { dd = b.dataset.d; s.querySelectorAll('[data-d]').forEach(y => y.classList.toggle('on', y === b)); });
    s.querySelector('#plS').onclick = async () => { try { await rpc('fh_trip_item_save', { p_trip: t.id, p_id: p ? p.id : null, p_kind: 'plan', p_day: dd || null, p_time: s.querySelector('#plT').value, p_title: s.querySelector('#plN').value, p_place: s.querySelector('#plP').value.trim(), p_memo: s.querySelector('#plM').value.trim(), p_assignee: null }); close(); toast('저장했어요'); reload(); } catch (e) { toast(e.message, 1); } };
    if (p) s.querySelector('#plD').onclick = async () => { await rpc('fh_trip_item_del', { p_id: p.id }); close(); reload(); };
    setTimeout(() => !p && s.querySelector('#plN').focus(), 80);
  });
}

let PACK_WHO = null;
function tripPack(el, r, t, reload) {
  const packs = r.items.filter(i => i.kind === 'pack'), dn = packs.filter(p => p.done).length;
  const groups = [[null, '👨‍👩‍👧‍👦 공용']].concat(t.members.map(i => [i, `${M(i).emoji} ${M(i).nick}`]));
  if (PACK_WHO !== null && !t.members.includes(PACK_WHO)) PACK_WHO = null;
  el.innerHTML = `<div class="card">${packs.length ? `<div class="row"><div class="bar" style="flex:1;height:14px"><i style="width:${dn / packs.length * 100}%"></i></div><b style="font-weight:400">${dn}/${packs.length}</b></div>${dn === packs.length ? '<p style="text-align:center;margin:8px 0 0">🎉 모두 챙겼어요! 출발 준비 끝</p>' : ''}<div class="sep"></div>` : ''}
      <label class="lbl" style="margin-top:0">누구 준비물?</label><div class="who-chips">${groups.map(([i, n]) => `<button data-pw="${i ?? ''}" class="${PACK_WHO === i ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="row"><input class="inp" id="pkIn" maxlength="80" placeholder="준비물 적기" enterkeyhint="done"><button class="btn p" id="pkAdd">추가</button></div>
      <label class="lbl">한 번에 넣기 (템플릿)</label><div class="chips">${Object.keys(PACK_TPL).map(k => `<button class="chip" data-tpl="${k}">${k}</button>`).join('')}</div>
      <p class="hint">템플릿은 위에서 고른 사람(또는 공용)에게 들어가요. 체크는 가족 누구나 할 수 있어요.</p></div>
    ${groups.map(([i, n]) => { const l = packs.filter(p => (p.assignee ?? null) === i); if (!l.length) return ''; const d = l.filter(p => p.done).length;
      return `<div class="card"><h3>${n} <small>${d}/${l.length}</small></h3><ul class="tlist">${l.map(p => `<li class="${p.done ? 'done' : ''}"><button class="ck" data-pk="${p.id}">${p.done ? '✓' : ''}</button><span class="tt" data-pk="${p.id}">${esc(p.title)}${p.done && p.done_by ? ` <small class="muted">${M(p.done_by).emoji}</small>` : ''}</span><button class="del" data-pkd="${p.id}">✕</button></li>`).join('')}</ul></div>`; }).join('')}`;
  $$('[data-pw]', el).forEach(b => b.onclick = () => { PACK_WHO = b.dataset.pw ? +b.dataset.pw : null; $$('[data-pw]', el).forEach(y => y.classList.toggle('on', y === b)); });
  const add = async () => { const v = $('#pkIn').value.trim(); if (!v) return; try { await rpc('fh_trip_item_save', { p_trip: t.id, p_id: null, p_kind: 'pack', p_day: null, p_time: null, p_title: v, p_place: null, p_memo: null, p_assignee: PACK_WHO }); reload(); } catch (e) { toast(e.message, 1); } };
  $('#pkAdd').onclick = add; $('#pkIn').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } };
  $$('[data-tpl]', el).forEach(b => b.onclick = async () => { const x = await rpc('fh_trip_pack_bulk', { p_trip: t.id, p_titles: PACK_TPL[b.dataset.tpl], p_assignee: PACK_WHO }); toast(`${x.added}개 넣었어요`); reload(); });
  $$('[data-pk]', el).forEach(b => b.onclick = async () => { await rpc('fh_trip_item_toggle', { p_id: +b.dataset.pk }); reload(); });
  $$('[data-pkd]', el).forEach(b => b.onclick = async () => { await rpc('fh_trip_item_del', { p_id: +b.dataset.pkd }); reload(); });
}

function tripDoc(el, r, t, reload) {
  const limit = addDays(t.end_on, 183), abroad = isAbroad(t);
  const warn = f => f.kind === 'passport' && f.expires_on ? (f.expires_on < t.end_on ? '<span class="tag no">⛔ 여행 중 만료</span>' : f.expires_on < limit ? '<span class="tag wait">⚠️ 6개월 미만</span>' : '<span class="tag ok">유효</span>') : '';
  const who = [...t.members, null];
  el.innerHTML = `<div class="card" style="background:#fff9db"><div class="row"><span style="font-size:28px">🔐</span><span style="flex:1;font-size:13.5px;line-height:1.55">이 여행에 <b>함께 가는 가족만</b>볼 수 있어요.<br><small class="muted">여권은 민감한 정보라 여행이 끝나면 지우는 걸 추천해요.</small></span></div>
      <button class="btn p block" id="dcAdd" style="margin-top:10px">📷 서류·사진 올리기</button></div>
    ${abroad ? `<div class="card"><h3>🛂 여권 체크 <small>귀국일 기준 6개월 이상 남아야 안전해요</small></h3>${t.members.map(i => { const pp = r.files.find(f => f.kind === 'passport' && f.member === i);
      return `<div class="ev"><span class="ei">${M(i).emoji}</span><span class="eb">${esc(M(i).nick)}<small>${pp ? (pp.expires_on ? '만료 ' + pp.expires_on.replace(/-/g, '.') : '만료일 미입력') : '여권 사진 없음'}</small></span>${pp ? warn(pp) || '<span class="tag">확인</span>' : '<span class="tag no">미등록</span>'}</div>`; }).join('')}</div>` : ''}
    ${who.map(i => { const l = r.files.filter(f => (f.member ?? null) === i); if (!l.length) return '';
      return `<div class="card"><h3>${i ? `${M(i).emoji} ${esc(M(i).nick)}` : '👨‍👩‍👧‍👦 가족 공용'}</h3><div class="docs">${l.map(f => `<div class="doc"><div class="dimg" data-fid="${f.id}"></div><div class="dmeta">${(DOC_KIND[f.kind] || DOC_KIND.etc)[0]} ${esc(f.title || (DOC_KIND[f.kind] || DOC_KIND.etc)[1])}${f.expires_on ? `<small>~${f.expires_on.replace(/-/g, '.')}</small>` : ''}${warn(f)}</div><button class="del" data-fdel="${f.id}">🗑</button></div>`).join('')}</div></div>`; }).join('')}
    ${r.files.length ? '' : '<div class="empty">여권, 여권 사진, 항공권, 숙소 예약 화면을 올려 두면<br>공항·호텔에서 바로 꺼내 볼 수 있어요</div>'}`;

function tripSummary(r, t, withPack) {

  let s = `${t.emoji} ${t.title}\n📍 ${t.place || ''}${t.country ? ` (${t.country})` : ''}\n📅 ${md(t.start_on)} ~ ${md(t.end_on)} · ${nights(t)}\n👨‍👩‍👧‍👦 ${t.members.map(i => M(i).nick).join(', ')}\n`;
  if (t.stay) s += `🏨 ${t.stay}\n`;
  tripDays(t).forEach((k, i) => { const l = plans.filter(p => p.day === k); if (l.length) s += `\n[Day ${i + 1} · ${md(k)}]\n` + l.map(p => `${p.time ? p.time + ' ' : '· '}${p.title}${p.place ? ` (${p.place})` : ''}`).join('\n') + '\n'; });

  return s.trim();
}

  if ($('#pushTest')) $('#pushTest').onclick = async () => { const r = await rpc('fh_push_test'); toast(r.server ? `테스트 알림을 보냈어요 (구독 ${r.subs}개)` : '알림 서버가 아직 연결되지 않았어요 (설치 안내 5단계)', !r.server); };
  if ($('#inst')) $('#inst').onclick = () => { window.__bip.prompt(); window.__bip = null; };
  $('#logout').onclick = async () => { if (!(await confirmBox('로그아웃할까요?', '로그아웃'))) return; await rpc('fh_logout').catch(() => {}); logoutLocal(); location.hash = '#/'; render(); };
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__bip = e; });

/* ---------------- 웹 푸시 ---------------- */
const b64u = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
let SWR = null;
async function swReg() { if (!('serviceWorker' in navigator)) return null; if (SWR) return SWR; try { SWR = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; } catch (e) { SWR = null; } return SWR; }
async function pushState() {
  const sup = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if (!sup) return { can: false, on: false, hint: /iPhone|iPad/.test(navigator.userAgent) ? '홈 화면에 추가한 앱에서 열어 주세요' : '이 브라우저는 알림을 지원하지 않아요' };
  if (Notification.permission === 'denied') return { can: false, on: false, hint: '알림이 차단돼 있어요. 폰 설정 → 앱/사이트 알림에서 허용해 주세요' };
  const reg = await swReg(), sub = reg && await reg.pushManager.getSubscription().catch(() => null);
  return { can: true, on: !!sub && store.get('push_on', false), hint: sub ? '켜져 있어요' : '꺼져 있어요' };
}
async function pushEnable() {
  const perm = await Notification.requestPermission(); if (perm !== 'granted') throw new Error('알림을 허용해야 켤 수 있어요');
  const reg = await swReg(); if (!reg) throw new Error('앱 설치 기능을 쓸 수 없는 환경이에요');
  let sub = await reg.pushManager.getSubscription(); if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC_KEY) });
  const j = sub.toJSON(); await rpc('fh_push_save', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent });
  store.set('push_on', true); toast('🔔 알림을 켰어요');
}
async function pushDisable() { const reg = await swReg(), sub = reg && await reg.pushManager.getSubscription(); if (sub) { await rpc('fh_push_del', { p_endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe().catch(() => {}); } store.set('push_on', false); toast('알림을 껐어요'); }
async function pushSyncSilently() {   // 로그인한 사람이 바뀌어도 이 기기의 구독을 지금 사람에게 연결
  try { if (!store.get('push_on', false) || Notification.permission !== 'granted') return; const reg = await swReg(), sub = reg && await reg.pushManager.getSubscription(); if (!sub) return; const j = sub.toJSON(); await rpc('fh_push_save', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent }); } catch (e) {}
}
/* 앱을 열었을 때 오늘의 알림을 폰 알림으로도 한 번씩 (하루 1회, 항목별) */
async function notifyLocal(al) {
  try { if (!('Notification' in window) || Notification.permission !== 'granted') return; const reg = await swReg(); if (!reg) return;
    const k = 'shown_' + dayKey(), shown = store.get(k, []); const fresh = al.filter(a => /오늘|D-1|D-0|타임캡슐/.test(a.t) && !shown.includes(a.t));
    if (!fresh.length || document.visibilityState === 'visible') { store.set(k, shown.concat(fresh.map(a => a.t))); return; }
    for (const a of fresh) reg.showNotification(a.i + ' ' + a.t, { body: a.s, icon: 'icons/fh-192.png', badge: 'icons/badge.png', tag: a.t, data: { url: a.to } });
    store.set(k, shown.concat(fresh.map(a => a.t)));
  } catch (e) {}
}
if ('serviceWorker' in navigator) { swReg(); navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'fh-push' && S.me) { toast((e.data.data && e.data.data.title) || '새 알림'); } }); }
if (navigator.clearAppBadge) document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { navigator.clearAppBadge().catch(() => {}); SWR && SWR.active && SWR.active.postMessage({ type: 'clear-badge' }); } });

/* ---------------- 시작 ---------------- */
setInterval(() => { if (document.visibilityState === 'visible' && S.me && (location.hash === '' || location.hash === '#/')) rpc('fh_home').then(h => { const before = S.home && S.home.unread; S.home = h; S.members = h.members; if (h.unread !== before && $('header.top')) $('header.top').outerHTML = topBar('/', true); }).catch(() => {}); }, 60000);
render();
</script>
