<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Hub</title>
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#1d1d1f; --navy:#1d1d1f; --navy-2:#1d1d1f; --gray:#6e6e73; --gray-2:#86868b; --line:#d2d2d7; --line-2:#e8e8ed; --soft:#f5f5f7; --bg:#f5f5f7;
  --blue:#0071e3; --link:#0066cc; --org:#0071e3; --org-d:#0077ed; --org-soft:#e8f2fd; --red:#e30000; --grn:#1d8a3a; --grn-soft:#e9f7ee;
  --muted:var(--gray); --cream:var(--soft);
  --hf:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Apple SD Gothic Neo','Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  --bf:var(--hf);
  --safe-b:env(safe-area-inset-bottom,0px);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:15px;line-height:1.47;letter-spacing:-.022em;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none;padding:0;font-size:inherit;letter-spacing:inherit}
input,textarea,select{font-family:var(--bf);font-size:16px;color:var(--ink);letter-spacing:-.01em}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
b,strong{font-weight:600}
.hide{display:none!important}
[hidden]{display:none!important}
.muted{color:var(--muted)}
small{font-size:12px}
.ic{display:inline-block;vertical-align:-3px;flex:0 0 auto}

/* ===== global nav (apple style) ===== */
#app{min-height:100vh;background:var(--bg)}
.gnav{position:sticky;top:0;z-index:50;height:48px;background:rgba(250,250,252,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.gn-in{max-width:1024px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.gn-logo{display:flex;align-items:center;height:48px;color:var(--ink);text-decoration:none!important}
.gn-logo svg{width:24px;height:24px}
.gn-list{display:flex;align-items:center;gap:0;margin:0;padding:0;list-style:none;flex:1;justify-content:space-between;margin:0 26px}
.gn-item{position:static}
.gn-item>a{display:flex;align-items:center;height:48px;padding:0 9px;font-size:12px;color:rgba(0,0,0,.8);text-decoration:none!important;letter-spacing:-.01em}
.gn-item>a:hover,.gn-item.on>a{color:#000}
.gn-tools{display:flex;align-items:center;gap:6px}
.gn-btn{position:relative;width:36px;height:44px;display:grid;place-items:center;color:rgba(0,0,0,.8);text-decoration:none!important}
.gn-btn:hover{color:#000}
.gn-dot{position:absolute;top:10px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--blue);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.gn-burger{display:none}
.mega{position:fixed;left:0;right:0;top:48px;background:#fafafc;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;pointer-events:none}
.mega::after{content:"";position:fixed;left:0;right:0;top:100%;height:100vh;background:rgba(232,232,237,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none}
.gn-item:hover .mega{opacity:1;visibility:visible;pointer-events:auto;transition-delay:.12s}
.mega-in{max-width:1024px;margin:0 auto;padding:40px 16px 56px 100px;display:flex;gap:60px}
.mcol h6{margin:0 0 14px;font-size:12px;font-weight:400;color:var(--gray)}
.mcol a{display:block;color:var(--ink);text-decoration:none!important}
.mcol a:hover{color:var(--blue)}
.mcol.big a{font-size:24px;font-weight:600;line-height:1.1;letter-spacing:-.02em;margin-bottom:12px}
.mcol.sm a{font-size:12px;font-weight:600;margin-bottom:10px}
.mcol.big .sub{margin-top:26px}
.mcol.big .sub a{font-size:12px;font-weight:600;margin-bottom:10px}

/* mobile full-screen menu */
.mmenu{position:fixed;inset:0;z-index:60;background:#fafafc;overflow:auto;transform:translateY(-8px);opacity:0;visibility:hidden;transition:.25s}
.mmenu.on{opacity:1;visibility:visible;transform:none}
.mm-top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px}
.mm-top button{width:44px;height:44px;display:grid;place-items:center;color:var(--gray)}
.mm-body{padding:12px 48px 40px}
.mm-body h6{margin:0 0 14px;font-size:12px;font-weight:400;color:var(--gray)}
.mm-big a,.mm-big button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.02em;line-height:1.15;padding:5px 0;text-decoration:none!important}
.mm-big .chev{color:var(--gray-2);opacity:0;transition:.2s}
.mm-big a:hover .chev,.mm-big button:hover .chev{opacity:1}
.mm-sm{margin-top:34px}
.mm-sm a{display:block;font-size:17px;font-weight:600;color:var(--ink);padding:5px 0;text-decoration:none!important}

/* page header */
.phead{max-width:980px;margin:0 auto;padding:34px 20px 8px}
.phead .back{display:inline-flex;align-items:center;gap:2px;font-size:14px;color:var(--link);margin-bottom:6px}
.phead h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.phead p{margin:6px 0 0;color:var(--gray);font-size:17px}
.wrap{max-width:980px;margin:0 auto;padding:18px 20px 40px}

/* hero (home) */
.hero{text-align:center;padding:44px 20px 10px}
.hero h1{margin:0;font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
.hero p{margin:10px 0 0;font-size:21px;color:var(--ink);letter-spacing:-.02em}
.hero .date{margin-top:6px;font-size:14px;color:var(--gray)}
.chapter{display:flex;gap:6px;overflow-x:auto;justify-content:safe center;padding:18px 16px 22px;scrollbar-width:none;max-width:980px;margin:0 auto}
.chapter::-webkit-scrollbar{display:none}
.chapter a{flex:0 0 auto;width:78px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--ink);text-decoration:none!important;position:relative}
.chapter a i{font-style:normal;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.chapter a:hover{color:var(--link)}
.chapter .bdg{top:-2px;right:12px}

/* footer directory */
.nav.foot-dir{position:static;background:var(--soft);border-top:1px solid var(--line);padding:0 20px calc(30px + var(--safe-b));font-size:12px;color:var(--gray)}
.fd-in{max-width:980px;margin:0 auto}
.fd-note{padding:18px 0;border-bottom:1px solid var(--line);line-height:1.6}
.fd-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.fd-cols h6{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink)}
.fd-cols a{display:block;color:var(--gray);padding:3px 0;text-decoration:none!important}
.fd-cols a:hover{color:var(--ink);text-decoration:underline!important}
.fd-bot{padding:16px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nav .bdg{position:static;display:inline-grid;margin-left:4px;border:none}

/* cards & ui */
.card{background:#fff;border-radius:var(--r);padding:22px;margin-bottom:16px;border:none}
.card h3{margin:0 0 14px;font-weight:600;font-size:19px;color:var(--ink);display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
.card h3 small{font-weight:400;color:var(--gray);font-size:13px;margin-left:auto}
.card h3 small a{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--blue);border-radius:980px;background:transparent;padding:9px 18px;font-size:14px;font-weight:400;color:var(--blue);transition:background .15s,color .15s;text-decoration:none!important}
.btn:hover{background:var(--blue);color:#fff}
.btn.p,.btn.y,.btn.n,.btn.g{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:var(--org-d)}
.btn.r{border-color:var(--red);color:var(--red)}
.btn.r:hover{background:var(--red);color:#fff}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.block{width:100%;padding:12px 18px;font-size:16px}
.btn[disabled]{opacity:.35;pointer-events:none}
a.btn.p{color:#fff}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center}
.row>.inp{flex:1;min-width:0}
.lbl{display:block;margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:980px;padding:7px 14px;background:#fff;font-size:13px;color:var(--ink);text-decoration:none!important}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.empty{text-align:center;color:var(--gray);padding:28px 8px;line-height:1.6;font-size:15px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c,#1d1d1f);color:#fff;font-weight:600;flex:0 0 auto;line-height:1;overflow:hidden;letter-spacing:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.bar{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.hint{font-size:12.5px;color:var(--gray);line-height:1.6;margin:12px 0 0}
.sep{height:1px;background:var(--line-2);margin:16px 0}
.bdg{position:absolute;min-width:17px;height:17px;border-radius:9px;background:var(--blue);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 5px}

/* toast & modal */
#toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%) translateY(10px);opacity:0;background:rgba(29,29,31,.92);color:#fff;padding:12px 18px;border-radius:14px;z-index:200;transition:.2s;max-width:88vw;text-align:center;font-size:14px;pointer-events:none;backdrop-filter:blur(10px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s;backdrop-filter:blur(4px)}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + var(--safe-b));animation:up .22s}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 12px;font-weight:700;font-size:22px;color:var(--ink);display:flex;align-items:center;gap:8px;letter-spacing:-.025em}
.sheet h2 .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px;color:var(--gray)}
.sheet .foot{display:flex;gap:10px;margin-top:22px}
.sheet .foot .btn{flex:1;padding:11px 16px}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}
.lightbox .lb-bar{display:flex;gap:10px;margin-top:14px}
.lightbox .btn{border-color:#fff;color:#fff}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;background:#fff}
.login .lg-logo svg{width:56px;height:56px;color:var(--ink)}
.logo-big{font-weight:700;font-size:32px;letter-spacing:-.03em;margin:14px 0 0;line-height:1.1;color:var(--ink)}
.login .sub{margin:8px 0 30px;color:var(--gray);font-size:17px}
.who{display:flex;flex-direction:column;width:100%;max-width:360px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.who button{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:16px;color:var(--ink);border-bottom:1px solid var(--line-2);text-align:left}
.who button:last-child{border-bottom:none}
.who button::after{content:"›";margin-left:auto;color:var(--gray-2);font-size:20px}
.who button:hover{background:var(--soft)}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:20px 0 26px}
.pin-dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.pin-dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center}
.pad button{height:72px;width:72px;border-radius:50%;background:var(--soft);font-size:28px;font-weight:400;color:var(--ink)}
.pad button:active{background:var(--line)}
.pad button.fn{font-size:14px;background:none;color:var(--link)}

/* home */
.alerts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.alert{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 16px;text-align:left;width:100%;color:var(--ink)!important;text-decoration:none!important}
.alert:hover{box-shadow:0 4px 18px rgba(0,0,0,.06)}
.alert .ai{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);flex:0 0 34px}
.alert b{display:block;font-size:15px;font-weight:600}
.alert small{color:var(--gray);font-size:13px}
.alert.hot .ai{background:var(--blue);color:#fff}
.alert.gold .ai{background:var(--ink);color:#fff}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.mcard{background:#fff;border-radius:var(--r);padding:20px 18px 18px;text-align:left;position:relative;width:100%;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.mcard:hover{box-shadow:0 8px 28px rgba(0,0,0,.08);transform:translateY(-2px)}
.mcard .mtop{display:flex;align-items:center;gap:12px}
.mcard .mtop>div{min-width:0;flex:1;padding-right:22px}
.mcard .nm{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .nm small{font-weight:400}
.mcard .days{font-weight:700;font-size:30px;color:var(--ink);margin:16px 0 0;letter-spacing:-.03em;line-height:1}
.mcard .days small{font-weight:400;font-size:13px;color:var(--gray);margin-left:3px;letter-spacing:0}
.mcard .meta{font-size:12.5px;color:var(--gray);margin-top:5px;min-height:16px}
.mcard .bar{margin-top:12px}
.mcard .mood{position:absolute;top:18px;right:18px;font-size:17px}
.mcard .pt{font-size:12px;color:var(--gray)}
.mcard .st{font-size:12.5px;margin-top:6px;color:var(--link);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moodpick{display:flex;justify-content:space-between;gap:6px}
.moodpick button{flex:1;font-size:22px;padding:10px 0 8px;border-radius:12px;border:1px solid var(--line-2)}
.moodpick button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.moodpick button small{display:block;font-size:11px;color:var(--gray);margin-top:3px}
.score-row{display:flex;align-items:center;gap:14px;margin-top:14px}
.score-row input[type=range]{flex:1;accent-color:var(--blue);height:28px}
.score-big{font-weight:700;font-size:28px;color:var(--ink);min-width:70px;text-align:right;letter-spacing:-.03em}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.quick a,.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none!important;color:var(--ink);font-size:12px;padding:10px 2px;position:relative;border-radius:12px}
.quick a:hover{color:var(--link)}
.quick i{font-style:normal;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.quick .bdg{top:4px;right:calc(50% - 24px)}
.otd{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.otd .ph{flex:0 0 110px;height:110px;border-radius:14px;background:#eee center/cover;position:relative;cursor:pointer}
.otd .ph span{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 7px;border-radius:8px;backdrop-filter:blur(6px)}

/* todo */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 44px;border-radius:12px;padding:7px 0;background:var(--soft);font-size:16px;font-weight:600;line-height:1.15;color:var(--ink)}
.strip button small{display:block;font-size:10.5px;color:var(--gray);font-weight:400}
.strip button.part{box-shadow:inset 0 -3px 0 #a1c9f5}
.strip button.ok{box-shadow:inset 0 -3px 0 var(--blue)}
.strip button.today{color:var(--blue)}
.strip button.sel{background:var(--ink);color:#fff}
.strip button.sel small{color:#d2d2d7}
.tlist{list-style:none;margin:8px 0 0;padding:0}
.tlist li{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line-2)}
.tlist li:last-child{border-bottom:none}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid #c7c7cc;display:grid;place-items:center;font-size:13px;color:#fff;flex:0 0 auto;background:#fff}
.tlist li.done .ck,.shop li.done .ck{background:var(--blue);border-color:var(--blue)}
.tlist li .tt{flex:1;font-size:16px;word-break:break-all}
.tlist li.done .tt{text-decoration:line-through;color:var(--gray-2)}
.tlist li .del,.shop li .del{color:#c7c7cc;font-size:15px;padding:4px}
.who-chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.who-chips::-webkit-scrollbar{display:none}
.who-chips button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:980px;padding:4px 14px 4px 4px;background:#fff;font-size:13.5px;flex:0 0 auto;color:var(--ink)}
.who-chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pts{display:flex;justify-content:space-around;text-align:center}
.pts b{display:block;font-weight:700;font-size:28px;color:var(--ink);letter-spacing:-.03em}
.pts span{font-size:12px;color:var(--gray)}
.celebrate{text-align:center;padding:12px 0;color:var(--blue)}
.confetti{display:none}

/* family / map */
#map{height:340px;border-radius:14px;overflow:hidden;background:var(--soft);z-index:1}
.loc-list{list-style:none;margin:0;padding:0}
.loc-list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.loc-list li:last-child{border:none}
.loc-list .info{flex:1;min-width:0;font-weight:600}
.loc-list .info small{display:block;color:var(--gray);font-weight:400}
.arrive{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.arrive button{border-radius:14px;background:var(--soft);padding:16px 2px 12px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px}
.arrive button:hover{background:var(--line-2)}
.arrive button i{font-style:normal;color:var(--ink)}
.pin-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:600;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.3);overflow:hidden}
.pin-ic img{width:100%;height:100%;object-fit:cover}
.switch{position:relative;width:51px;height:31px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:20px;background:#e9e9ea;transition:.2s}
.switch span::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.switch input:checked+span{background:#34c759}
.switch input:checked+span::after{left:22px}

/* messages */
.msg{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.msg:last-child{border:none}
.msg .mb{flex:1;min-width:0}
.msg .mh{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--gray)}
.msg .mh b{color:var(--ink);font-size:14px}
.msg .mt{margin-top:6px;background:#e9e9eb;border-radius:18px;padding:10px 14px;white-space:pre-wrap;word-break:break-word;line-height:1.5;display:inline-block;max-width:100%}
.msg.out .mt{background:var(--blue);color:#fff}
.msg.out .mt a{color:#fff}
.sealed{margin-top:6px;background:var(--soft);border-radius:14px;padding:14px;text-align:center;width:100%;font-size:14px;color:var(--link)}
.cap{border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}
.cap.locked{background:#fff}
.cap .ch{display:flex;align-items:center;gap:12px}
.cap .dd{margin-left:auto;font-weight:600;color:var(--ink);font-size:15px}
.cap .cb{margin-top:12px;white-space:pre-wrap;line-height:1.6;background:var(--soft);border-radius:12px;padding:14px}

/* board */
.post{background:#fff;border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.post .ph{display:flex;align-items:center;gap:12px;padding:16px 18px;font-weight:600}
.post .ph small{display:block;color:var(--gray);font-weight:400}
.post .ph .more{margin-left:auto;color:var(--gray-2);padding:4px 6px}
.post .pb{padding:0 18px 14px;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:16px}
.pics{display:grid;gap:2px;background:#fff}
.pics.n1{grid-template-columns:1fr}
.pics.n2,.pics.n4{grid-template-columns:1fr 1fr}
.pics.n3,.pics.n5,.pics.n6{grid-template-columns:1fr 1fr 1fr}
.pics .pic{aspect-ratio:1;background:var(--soft) center/cover no-repeat;cursor:pointer}
.pics.n1 .pic{aspect-ratio:auto;min-height:220px;max-height:560px}
.post .pa{display:flex;gap:16px;padding:12px 18px;font-size:13.5px;align-items:center;color:var(--gray)}
.post .pa button{display:flex;align-items:center;gap:5px}
.post .pa .liked{color:#ff375f}
.post .pa .liked svg{fill:#ff375f}
.post .cm{padding:0 18px 16px;font-size:14px}
.post .cm div{padding:4px 0;display:flex;gap:6px;align-items:flex-start}
.post .cm div b{flex:0 0 auto}
.post .cm div span{flex:1;word-break:break-word}
.post .cm div button{color:#c7c7cc}
.upl{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.upl .th{width:76px;height:76px;border-radius:12px;background:#eee center/cover;position:relative}
.upl .th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px}
.upl .add{width:76px;height:76px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;background:#fff;color:var(--gray)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px}
.album .pic{aspect-ratio:1;background:var(--soft) center/cover;border-radius:6px;cursor:pointer}

/* more */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:#fff;border-radius:var(--r);padding:24px 10px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none!important;color:var(--ink);position:relative;font-size:15px;font-weight:600;text-align:center;transition:box-shadow .2s,transform .2s}
.tile:hover{box-shadow:0 8px 28px rgba(0,0,0,.08);transform:translateY(-2px)}
.tile i{font-style:normal;color:var(--ink)}
.tile.acc i{color:var(--blue)}
.tile small{font-size:12px;color:var(--gray);font-weight:400}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h b{font-weight:700;font-size:21px}
.cal-h .btn{border:none;font-size:18px;padding:4px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:12px;color:var(--gray);padding:2px 0 8px}
.cal button{aspect-ratio:1;border-radius:50%;font-size:15px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);max-width:48px;margin:0 auto;width:100%}
.cal button.out{color:#c7c7cc}
.cal button.td{color:var(--red);font-weight:700}
.cal button.sel{background:var(--ink);color:#fff}
.cal button.sel.td{background:var(--red)}
.cal button.sun{color:var(--gray)}
.cal button .dots{display:flex;gap:2px;position:absolute;bottom:4px}
.cal button .dots i{width:4px;height:4px;border-radius:50%;background:var(--blue)}
.ev{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.ev:last-child{border:none}
.ev .ei{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);flex:0 0 34px;font-size:16px}
.ev .eb{flex:1;min-width:0;font-size:15px}
.ev .eb small{display:block;color:var(--gray)}
.ev .dd{font-weight:600;font-size:14px;color:var(--blue);white-space:nowrap}

/* shop / mission / growth / report */
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line-2)}
.shop li:last-child{border:none}
.shop li.done .tt{text-decoration:line-through;color:var(--gray-2)}
.shop li .tt{flex:1}
.shop li .tt small{display:block;color:var(--gray)}
.ms{border-radius:var(--r);padding:20px;margin-bottom:14px;background:#fff}
.ms .mh{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600}
.ms .mh i{font-style:normal;font-size:24px}
.ms .mh small{display:block;font-size:12.5px;color:var(--gray);font-weight:400}
.ms .num{margin-left:auto;font-weight:700;font-size:19px;text-align:right;letter-spacing:-.02em}
.ms .bar{margin:14px 0 10px;height:6px;border-radius:3px}
.ms .per{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--gray)}
.gtable{width:100%;border-collapse:collapse;font-size:14px}
.gtable th,.gtable td{padding:10px 4px;border-bottom:1px solid var(--line-2);text-align:center}
.gtable th{color:var(--gray);font-weight:400;font-size:12.5px}
.gchart{width:100%;height:auto;display:block}
.rep{border-radius:var(--r);padding:20px;margin-bottom:14px;background:#fff;position:relative}
.rep .rh{display:flex;align-items:center;gap:12px}
.rep .rh b{font-size:17px}
.rep .crown{position:absolute;top:20px;right:20px;font-size:11px;font-weight:600;color:#fff;background:var(--blue);padding:3px 9px;border-radius:980px}
.rep .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;text-align:center}
.rep .stats div{background:var(--soft);border-radius:12px;padding:10px 2px}
.rep .stats b{display:block;font-weight:700;font-size:18px;letter-spacing:-.02em}
.rep .stats span{font-size:11px;color:var(--gray)}
.rep .moods{margin-top:12px;font-size:17px;letter-spacing:4px}
.lead{list-style:none;margin:0;padding:0}
.lead li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.lead li:last-child{border:none}
.lead .rk{font-weight:700;font-size:15px;width:22px;text-align:center;color:var(--gray-2)}
.lead li:first-child .rk{color:var(--blue)}
.lead .pv{margin-left:auto;font-weight:700;font-size:17px}
.rw{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.rw:last-child{border:none}
.rw .rb{flex:1;font-weight:600}
.rw .rb small{display:block;color:var(--gray);font-weight:400}
.stk{display:flex;gap:8px;flex-wrap:wrap}
.stk button{font-size:22px;width:48px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:#fff}
.stk button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:980px;background:var(--soft);color:var(--gray);margin-left:4px;font-weight:500}
.tag.ok{background:var(--grn-soft);color:var(--grn)}.tag.wait{background:#fff6e5;color:#b25000}.tag.no{background:#ffecec;color:var(--red)}

/* digital hub */
.hub-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.hub-list{list-style:none;margin:0;padding:0}
.hub-list li{border-bottom:1px solid var(--line-2)}
.hub-list .hm{display:flex;align-items:center;gap:12px;padding:12px 2px;width:100%;text-align:left}
.hub-list .hi{width:30px;height:30px;flex:0 0 30px}
.hub-list .ht{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.hub-list .hd{font-size:12px;color:var(--gray)}
.hub-memo{padding:0 4px 14px 44px;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:15px}
.hub-memo img{width:90px;height:90px;object-fit:cover;border-radius:10px;margin:6px 6px 0 0}
.htypes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.htypes button{border:1px solid var(--line-2);border-radius:12px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;background:#fff}
.htypes button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.htypes button i{width:28px;height:28px;display:block}
.chips .chip i{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:4px}

/* trip */
.trip-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--soft);color:var(--ink)!important;text-decoration:none!important}
.card .trip-card:last-child{margin-bottom:0}
.trip-card:hover{background:var(--line-2)}
.trip-card .te{font-size:26px;width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:0 0 46px}
.trip-card .tb{flex:1;min-width:0;display:flex;flex-direction:column}
.trip-card .tb b{font-size:16px}
.trip-card .tb small{color:var(--gray);font-size:12.5px}
.trip-card .tm{font-size:12px;margin-top:5px;color:var(--gray);display:flex;gap:2px}
.trip-card.other{opacity:.5}
.trip-card.now{box-shadow:inset 0 0 0 2px var(--blue)}
.tdd{font-weight:700;color:var(--blue);font-size:16px;white-space:nowrap}
.tdd.big{font-size:22px}
.trip-head{}
.ttabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 16px;padding-bottom:4px;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
.ttabs .chip{flex:0 0 auto}
.card.day.today{box-shadow:inset 0 0 0 2px var(--blue)}
.plan{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.plan:last-child{border:none}
.plan .pt{font-weight:600;color:var(--blue);width:48px;flex:0 0 48px;font-size:14px}
.plan .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.plan .pb b{font-size:16px}
.plan .pb small{color:var(--gray);white-space:pre-wrap}
.plan .pmap{font-size:13px;color:var(--link)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.doc{border-radius:14px;overflow:hidden;position:relative;background:var(--soft)}
.doc .dimg{aspect-ratio:4/3;background:#e8e8ed center/cover;cursor:pointer}
.doc .dmeta{padding:10px 12px;font-size:13px;line-height:1.45}
.doc .dmeta small{display:block;color:var(--gray)}
.doc .del{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border-radius:980px;padding:3px 8px;color:var(--gray)}

.ig-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ig-icon{width:60px;height:60px;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.08)}
.ig-head b{display:block;font-size:19px;letter-spacing:-.02em}
.ig-head small{color:var(--gray);font-size:13px}
.ig-head .x{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px;color:var(--gray)}
.ig-lead{margin:0 0 12px;font-size:15px;line-height:1.55}
.ig-steps{list-style:none;margin:0 0 12px;padding:0;background:var(--soft);border-radius:14px}
.ig-steps li{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid #e8e8ed;font-size:14.5px;line-height:1.5}
.ig-steps li:last-child{border-bottom:none}
.ig-n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.ig-arrow{text-align:center;font-size:12.5px;color:var(--link);margin:4px 0 2px}
.ig-benefit{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.ig-benefit span{font-size:12px;color:var(--gray);background:var(--soft);border-radius:980px;padding:4px 10px}
.pf-h{font-size:12px;font-weight:600;color:var(--gray);margin:14px 0 2px}
.pf-list li.pf{display:block;padding:14px 2px}
.pf-top{display:flex;align-items:center;gap:12px}
.pf-ck{color:var(--blue)!important}
li.pf.done .pf-ck{background:var(--blue);border-color:var(--blue);color:#fff!important}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0 36px}
.pf-slot{position:relative;aspect-ratio:4/3;border-radius:12px;border:1.5px dashed var(--line);background:var(--soft) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gray);font-size:12.5px}
.pf-slot.has{border:none}
.pf-slot em{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:10.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:1px 7px;border-radius:980px;display:none}
.pf-slot.has em{display:block}
.pf-slot.busy{opacity:.5}
.pf-slot[disabled]{opacity:.5}
.pf-note{margin:10px 0 0 36px;font-size:13px;background:#ffecec;color:var(--red);border-radius:10px;padding:8px 12px}
.pf-note.ok{background:var(--grn-soft);color:var(--grn)}
.pf-send{margin:12px 0 0 36px;width:calc(100% - 36px)!important;font-size:14.5px!important;padding:11px!important}
.pf-opt{margin-top:10px;font-size:13.5px;gap:8px;flex-wrap:wrap}
.pf-opt input{width:18px;height:18px;accent-color:var(--blue)}
.rv-ph{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rv-ph figure{margin:0}
.rv-img{aspect-ratio:3/4;border-radius:14px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;color:var(--gray);font-size:13px;cursor:zoom-in}
.rv-ph figcaption{text-align:center;font-size:12px;font-weight:600;color:var(--gray);margin-top:6px}
.gate{min-height:100vh;background:#fff;display:flex;justify-content:center;padding:40px 18px calc(30px + var(--safe-b))}
.gate-in{width:100%;max-width:440px;text-align:center}
.gate .lg-logo svg{width:52px;height:52px;color:var(--ink)}
.gate h1{margin:10px 0 0;font-size:30px;font-weight:700;letter-spacing:-.03em}
.gate-sub{margin:10px 0 22px;color:var(--gray);font-size:15px;line-height:1.6}
.gate-sub b{color:var(--ink)}
.gate-card{text-align:left;background:#fff;border:1px solid var(--line-2);border-radius:18px;padding:18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.gate-foot{margin-top:18px;font-size:13px;color:var(--gray)}
.setup-warn{background:#fff;border-radius:18px;padding:22px;margin:24px;line-height:1.6}
.loader{display:grid;place-items:center;min-height:50vh}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.leaflet-container{font-family:var(--bf)!important}
.photo-edit{display:flex;align-items:center;gap:16px}
.photo-edit .av{cursor:pointer}

/* iOS 스타일 하단 탭바 (모바일) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:repeat(5,1fr);background:rgba(250,250,252,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.18);padding:6px 4px calc(4px + var(--safe-b))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8e8e93;font-size:10px;font-weight:500;text-decoration:none!important;position:relative;padding:2px 0}
.tabbar a.on{color:var(--blue)}
.tabbar .tb-dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:#ff3b30}
@media(max-width:833px){
  .tabbar{display:grid}
  .nav.foot-dir{display:none}
  #app{padding-bottom:calc(70px + var(--safe-b))}
  .gn-burger{display:none!important}
  .gnav{height:44px}.gn-in{height:44px}.gn-logo{height:44px}.gn-logo svg{width:22px;height:22px}
  #toast{bottom:calc(84px + var(--safe-b))}
  .phead{padding:18px 16px 2px}
  .phead h1{font-size:30px}
  .phead p{font-size:15px}
  .wrap{padding:12px 12px 24px}
  .card{padding:16px;border-radius:14px;margin-bottom:12px}
  .card h3{font-size:17px}
  .hero{padding:26px 16px 0;text-align:left}
  .hero h1{font-size:30px}
  .hero p{font-size:16px;color:var(--gray)}
  .chapter{justify-content:flex-start;padding:14px 0 12px;gap:0;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
  .chapter a{width:20vw;max-width:none;font-size:11px;scroll-snap-align:start;gap:6px}
  .chapter a i{width:40px;height:40px}
  .chapter.top-ch{background:#fff;border-bottom:1px solid var(--line-2);padding:10px 0 8px}
  .chapter a.on{color:var(--blue)}
  .chapter a.on i{color:var(--blue)}
  .chapter .bdg{right:calc(10vw - 22px)}
  .mcard{border-radius:14px}
  .fam{gap:10px}
  .alert{border-radius:12px;padding:12px 14px}
  .sheet{padding:18px 16px calc(18px + var(--safe-b))}
  .btn.block{padding:13px 18px;font-size:16px}
}

@media(max-width:833px){
  .gn-list{display:none}
  .gn-burger{display:grid}
  .gn-in{padding:0 8px 0 16px}
  .mega{display:none}
  .phead{padding:26px 20px 4px}
  .phead h1{font-size:28px}
  .wrap{padding:14px 16px 32px}
  .hero{padding:34px 20px 6px}
  .hero h1{font-size:36px}
  .hero p{font-size:19px}
  .fam{grid-template-columns:1fr 1fr;gap:12px}
  .mcard{padding:16px 14px 14px}
  .mcard .days{font-size:24px}
  .card{padding:18px}
  .fd-cols{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:repeat(2,1fr)}
}

/* ===== 모바일 컴팩트 (약 80% 크기) ===== */
.fam>*,.mcard,.mcard .mtop>div{min-width:0}
@media(max-width:833px){
  body{font-size:14px}
  .gnav,.gn-in,.gn-logo{height:44px}
  .gn-logo svg{width:20px;height:20px}
  .gn-btn{width:34px;height:40px}
  .gn-btn .av{width:22px!important;height:22px!important;font-size:10px!important}
  .hero{padding:18px 16px 2px}
  .hero h1{font-size:24px;line-height:1.15}
  .hero p{font-size:14px;margin-top:6px}
  .hero .date{font-size:12px;margin-top:2px}
  .chapter{padding:10px 0 8px}
  .chapter a{font-size:10.5px;gap:4px}
  .chapter a i{width:34px;height:34px}
  .chapter svg{width:22px;height:22px}
  .phead{padding:14px 16px 0}
  .phead h1{font-size:24px}
  .phead p{font-size:13px;margin-top:3px}
  .phead .back{font-size:13px;margin-bottom:2px}
  .wrap{padding:10px 12px 20px}
  .alerts{gap:6px;margin-bottom:10px}
  .alert{padding:9px 12px;gap:10px;border-radius:12px}
  .alert .ai{width:28px;height:28px;flex:0 0 28px}
  .alert .ai svg{width:15px;height:15px}
  .alert b{font-size:13.5px}
  .alert small{font-size:11.5px}
  .fam{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .mcard{padding:12px 11px 11px;border-radius:14px}
  .mcard .mtop{gap:8px}
  .mcard .av{width:30px!important;height:30px!important;font-size:12.5px!important}
  .mcard .mtop>div{padding-right:16px}

const LOC = { lastSent: 0, watch: null };
function locAuto() {   // 앱을 열어둔 동안만 위치를 보냄 (2분 간격)
  if (!('geolocation' in navigator) || !store.get('loc_on', false) || document.visibilityState !== 'visible') return;

  navigator.geolocation.getCurrentPosition(p => rpc('fh_loc_update', { p_lat: p.coords.latitude, p_lng: p.coords.longitude, p_acc: Math.round(p.coords.accuracy) }).catch(() => {}), () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me) { locAuto(); const p = (location.hash.slice(1) || '/').split('?')[0]; if (p === '/' || p === '/family' || p === '/msg') render(); } });

}

function lineChart(pts, color, unit) {
  const W = 340, H = 140, P = 26, xs = pts.map(p => D(p[0]).getTime()), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1, y0 = Math.min(...ys), y1 = Math.max(...ys), yp = (y1 - y0) * .15 || 1;
  const X = t => P + (t - x0) / ((x1 - x0) || 1) * (W - P * 2), Y = v => H - P + 8 - (v - (y0 - yp)) / ((y1 + yp) - (y0 - yp)) * (H - P * 1.6);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  return `<svg class="gchart" viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${H - P + 8}" x2="${W - P}" y2="${H - P + 8}" stroke="#ecdcc6" stroke-width="1.5"/><path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"/>${i === 0 || i === pts.length - 1 ? `<text x="${X(xs[i]).toFixed(1)}" y="${(Y(p[1]) - 9).toFixed(1)}" text-anchor="${i === 0 ? 'start' : 'end'}" font-size="12" fill="#2b2f3a">${p[1]}${unit}</text><text x="${X(xs[i]).toFixed(1)}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : 'end'}" font-size="10.5" fill="#8a8f9a">${p[0].slice(2).replace(/-/g, '.')}</text>` : ''}`).join('')}</svg>`;
}

function tripSummary(r, t, withPack) {
  const plans = r.items.filter(i => i.kind === 'plan'), left = r.items.filter(i => i.kind === 'pack' && !i.done);
  let s = `${t.emoji} ${t.title}\n📍 ${t.place || ''}${t.country ? ` (${t.country})` : ''}\n📅 ${md(t.start_on)} ~ ${md(t.end_on)} · ${nights(t)}\n👨‍👩‍👧‍👦 ${t.members.map(i => M(i).nick).join(', ')}\n`;
  if (t.stay) s += `${t.stay}\n`;
  tripDays(t).forEach((k, i) => { const l = plans.filter(p => p.day === k); if (l.length) s += `\n[Day ${i + 1} · ${md(k)}]\n` + l.map(p => `${p.time ? p.time + ' ' : '· '}${p.title}${p.place ? ` (${p.place})` : ''}`).join('\n') + '\n'; });

  return s.trim();
}
